<section class="modulex-ik2{{ik2adresvar}}" id="ik2-{{id}}">
  <div class="modulex-ik2-wrap">
    {{ik2head}}
    {{ik2empty}}
    <ul class="modulex-ik2-grid" aria-label="{{groupLabel}}">{{ik2tiles}}</ul>
  </div>
</section>

<style>

  .modulex-ik2 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(36px, 6vw, 80px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-ik2 *, .modulex-ik2 *::before, .modulex-ik2 *::after { box-sizing: border-box; }

  .modulex-ik2-tel { grid-column: span 2; background: --accent--; color: --accentText--; border-color: transparent; }
  .modulex-ik2-ikon {

  .modulex-ik2 a.modulex-ik2-btn, .modulex-ik2 a.modulex-ik2-btn:visited {

  }
  .modulex-ik2-tile:hover { border-color: --accent--; }

    .modulex-ik2 *, .modulex-ik2 *::before, .modulex-ik2 *::after { animation: none !important; transition: none !important; }
  }
</style>
