<section class="modulex-ekip-jenerik{{fbsinif}}" {{fbetiket}}>

<style>
  /* ekip-jenerik — Fotoğrafsız ekip sunumu (jenerik metaforu): görseli olmayan ya da tipografik kimlikli markalar için. */
  .modulex-ekip-jenerik { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ekip-jenerik *, .modulex-ekip-jenerik *::before, .modulex-ekip-jenerik *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ekip-jenerik :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ekip-jenerik :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ekip-jenerik :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ekip-jenerik :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ekip-jenerik img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ekip-jenerik) img { height: auto; }
  .modulex-ekip-jenerik [hidden] { display: none !important; }
  .modulex-ekip-jenerik :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ekip-jenerik :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ekip-jenerik-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ekip-jenerik-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ekip-jenerik--bassiz .modulex-ekip-jenerik-bas { display: none; }
  .modulex-ekip-jenerik-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ekip-jenerik-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ekip-jenerik-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ekip-jenerik-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-ekip-jenerik-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ekip-jenerik-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ekip-jenerik-dugme:hover { transform: translateY(-2px); }
  .modulex-ekip-jenerik-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ekip-jenerik-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ekip-jenerik-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ekip-jenerik-jenerik { display: grid; justify-items: center; gap: clamp(26px, 4vw, 44px); text-align: center; }
  .modulex-ekip-jenerik-satir { position: relative; display: grid; justify-items: center; gap: 6px; transition: opacity 0.8s ease, transform 0.8s ease; transition-delay: calc(var(--i) * 110ms); }
  .modulex-ekip-jenerik-satir + .modulex-ekip-jenerik-satir::before { content: ""; width: 6px; height: 6px; margin-block-end: clamp(14px, 2vw, 24px); border-radius: 50%; background-color: --accent--; }
  .modulex-ekip-jenerik--hazir:not(.modulex-ekip-jenerik--gor) .modulex-ekip-jenerik-satir { opacity: 0; transform: translateY(18px); }
  .modulex-ekip-jenerik-unvan { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
  .modulex-ekip-jenerik-ad { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 4.6vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; transition: color 0.3s ease; }
  .modulex-ekip-jenerik-satir:hover .modulex-ekip-jenerik-ad { color: --accentInk--; }
  .modulex-ekip-jenerik-bolum { letter-spacing: 0.14em; }
  @media (max-width: 768px) {
    .modulex-ekip-jenerik-ad { font-size: 1.7rem; }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-jenerik) img { height: auto; }
  .modulex-ekip-jenerik-foto { min-width: 0; }
  .modulex-ekip-jenerik-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-jenerik-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-jenerik-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-jenerik-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-jenerik-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-jenerik-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-jenerik-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-jenerik-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-jenerik-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-jenerik-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-jenerik-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-jenerik-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-jenerik :is(.modulex-ekip-jenerik-baslik, .modulex-ekip-jenerik-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-jenerik-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-jenerik { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-jenerik *, .modulex-ekip-jenerik *::before, .modulex-ekip-jenerik *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-jenerik";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
